<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <title>Time Logger</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #2a2a2a;
            padding: 1rem;
            text-align: center;
            border-bottom: 2px solid #3a3a3a;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .status {
            padding: 0.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: #888;
        }

        .status.connected {
            color: #4CAF50;
        }

        .status.error {
            color: #f44336;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            gap: 1rem;
        }

        .config {
            background: #2a2a2a;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .config h2 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: #aaa;
        }

        .config-field {
            margin-bottom: 1rem;
        }

        .config-field label {
            display: block;
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 0.5rem;
        }

        .config-field input {
            width: 100%;
            padding: 0.75rem;
            background: #1a1a1a;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            color: #ffffff;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 2rem;
            font-size: 1.5rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-start {
            background: #4CAF50;
            color: white;
        }

        .btn-start:active {
            background: #45a049;
        }

        .btn-done {
            background: #2196F3;
            color: white;
        }

        .btn-done:active {
            background: #0b7dda;
        }

        .btn-connect {
            background: #0061FF;
            color: white;
            padding: 1rem;
            font-size: 1rem;
            margin-top: 0.5rem;
        }

        .btn-disconnect {
            background: #666;
            color: white;
            padding: 0.75rem;
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        .btn-settings-toggle {
            background: transparent;
            border: 1px solid #3a3a3a;
            color: #888;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            text-transform: none;
            letter-spacing: normal;
        }

        .btn-settings-toggle:active {
            background: #2a2a2a;
        }

        .settings-collapsible {
            margin-bottom: 1rem;
        }

        .settings-collapsible.collapsed {
            display: none;
        }

        .recent-log {
            background: #2a2a2a;
            padding: 1rem;
            border-radius: 8px;
            margin-top: auto;
            font-size: 0.85rem;
            color: #888;
            max-height: 200px;
            overflow-y: auto;
        }

        .recent-log pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .hidden {
            display: none;
        }

        .notes-field {
            margin: 1rem 0;
        }

        .notes-field input {
            width: 100%;
            padding: 0.75rem;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            color: #ffffff;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>⏱️ Time Logger</h1>
    </div>

    <div class="status" id="status">Not connected</div>

    <div class="main">
        <div class="config" id="configPanel">
            <h2>Connect to Dropbox</h2>
            <div class="config-field">
                <label>Dropbox Folder Path</label>
                <input type="text" id="folderPath" placeholder="/timelogs" value="/timelogs">
            </div>
            <button class="btn-connect" id="connectBtn">Connect to Dropbox</button>
        </div>

        <div id="loggerPanel" class="hidden">
            <button class="btn-settings-toggle" id="settingsToggle">⚙️ Settings</button>
            
            <div class="config settings-collapsible collapsed" id="settingsPanel">
                <h2>Settings</h2>
                <div class="config-field">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="rkolewe">
                </div>
                <div class="config-field">
                    <label>Hostname</label>
                    <input type="text" id="hostname" placeholder="workroom">
                </div>
                <div class="config-field">
                    <label>Dropbox Folder Path</label>
                    <input type="text" id="folderPathLogger" placeholder="/timelogs">
                </div>
                <button class="btn-disconnect" id="disconnectBtn">Disconnect from Dropbox</button>
            </div>

            <div class="notes-field">
                <input type="text" id="notes" placeholder="Optional notes (e.g., §63)">
            </div>

            <button class="btn-start" id="startBtn">
                ▶️ Start Writing
            </button>

            <button class="btn-done" id="doneBtn">
                ✓ Done
            </button>

            <div class="recent-log" id="recentLog">
                <strong>Recent entries will appear here...</strong>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/dropbox/dist/Dropbox-sdk.min.js"></script>
    <script>
        const DROPBOX_APP_KEY = 'evyhtrp9879xmbe';
        
        let dbx = null;
        let config = {
            username: '',
            hostname: '',
            folderPath: '/timelogs'
        };

        // ── PKCE helpers ──────────────────────────────────────────

        function generateRandomString(length) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
            const randomValues = crypto.getRandomValues(new Uint8Array(length));
            return Array.from(randomValues, v => chars[v % chars.length]).join('');
        }

        async function generatePKCE() {
            const codeVerifier = generateRandomString(128);
            const data = new TextEncoder().encode(codeVerifier);
            const digest = await crypto.subtle.digest('SHA-256', data);
            const codeChallenge = btoa(String.fromCharCode(...new Uint8Array(digest)))
                .replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
            return { codeVerifier, codeChallenge };
        }

        async function exchangeCodeForTokens(code) {
            const codeVerifier = localStorage.getItem('pkce_verifier');
            const redirectUri = window.location.origin + window.location.pathname;
            const response = await fetch('https://api.dropboxapi.com/oauth2/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    code,
                    grant_type: 'authorization_code',
                    client_id: DROPBOX_APP_KEY,
                    redirect_uri: redirectUri,
                    code_verifier: codeVerifier
                })
            });
            if (!response.ok) throw new Error('Token exchange failed');
            return response.json();
        }

        async function refreshAccessToken() {
            const refreshToken = localStorage.getItem('dropboxRefreshToken');
            if (!refreshToken) return false;
            try {
                const response = await fetch('https://api.dropboxapi.com/oauth2/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        refresh_token: refreshToken,
                        grant_type: 'refresh_token',
                        client_id: DROPBOX_APP_KEY
                    })
                });
                if (!response.ok) return false;
                const data = await response.json();
                localStorage.setItem('dropboxAccessToken', data.access_token);
                dbx = new Dropbox.Dropbox({ accessToken: data.access_token });
                return true;
            } catch (e) {
                return false;
            }
        }

        // ── Config ────────────────────────────────────────────────

        function loadConfig() {
            const saved = localStorage.getItem('timelogConfig');
            if (saved) {
                config = JSON.parse(saved);
                document.getElementById('username').value = config.username;
                document.getElementById('hostname').value = config.hostname;
                document.getElementById('folderPath').value = config.folderPath;
                const loggerFolderPath = document.getElementById('folderPathLogger');
                if (loggerFolderPath) loggerFolderPath.value = config.folderPath;
            }
        }

        function saveConfig() {
            config.username = document.getElementById('username').value;
            config.hostname = document.getElementById('hostname').value;
            const folderPathLogger = document.getElementById('folderPathLogger');
            config.folderPath = (folderPathLogger && folderPathLogger.value)
                ? folderPathLogger.value
                : document.getElementById('folderPath').value;
            localStorage.setItem('timelogConfig', JSON.stringify(config));
        }

        // ── Log helpers ───────────────────────────────────────────

        function getTimestamp() {
            const now = new Date();
            return [
                now.getFullYear(),
                String(now.getMonth() + 1).padStart(2, '0'),
                String(now.getDate()).padStart(2, '0')
            ].join('-') + ' ' + [
                String(now.getHours()).padStart(2, '0'),
                String(now.getMinutes()).padStart(2, '0'),
                String(now.getSeconds()).padStart(2, '0')
            ].join(':');
        }

        function getTodayFilename() {
            const now = new Date();
            return `--${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.txt`;
        }

        function getFilePath() {
            return `${config.folderPath.replace(/\/$/, '')}/${getTodayFilename()}`;
        }

        function createLogEntry(activity, notes = '') {
            let entry = `${getTimestamp()} ${config.username} on ${config.hostname} @journal  @${activity}\n`;
            if (notes) entry += `${notes}\n`;
            entry += ' \n';
            return entry;
        }

        // ── Dropbox write (with auto-refresh on 401) ──────────────

        async function writeEntry(activity) {
            if (!dbx) { setStatus('Not connected to Dropbox', 'error'); return; }
            saveConfig();
            if (!config.username || !config.hostname) {
                setStatus('Please enter username and hostname in Settings above', 'error');
                return;
            }
            if (!config.folderPath) {
                setStatus('Please enter Dropbox folder path', 'error');
                return;
            }
            try {
                await doWrite(activity);
            } catch (error) {
                if (error.status === 401) {
                    setStatus('Session expired, refreshing...', '');
                    if (await refreshAccessToken()) {
                        try {
                            await doWrite(activity);
                        } catch (retryError) {
                            setStatus(`Error: ${retryError.message}`, 'error');
                        }
                    } else {
                        // Refresh token also expired — need full re-auth
                        localStorage.removeItem('dropboxAccessToken');
                        localStorage.removeItem('dropboxRefreshToken');
                        dbx = null;
                        document.getElementById('configPanel').classList.remove('hidden');
                        document.getElementById('loggerPanel').classList.add('hidden');
                        setStatus('Session expired. Please reconnect to Dropbox.', 'error');
                    }
                } else {
                    console.error('Dropbox error:', error);
                    setStatus(`Error: ${error.message}`, 'error');
                }
            }
        }

        async function doWrite(activity) {
            setStatus('Writing to Dropbox...', '');
            const notes = document.getElementById('notes').value;
            const newEntry = createLogEntry(activity, notes);
            const filePath = getFilePath();

            let existingContent = '';
            try {
                const response = await dbx.filesDownload({ path: filePath });
                existingContent = await response.result.fileBlob.text();
            } catch (e) {
                if (e.status !== 409) throw e; // 409 = file not found, anything else re-throw
            }

            await dbx.filesUpload({
                path: filePath,
                contents: newEntry + existingContent,
                mode: 'overwrite'
            });

            setStatus(`✓ Logged @${activity}`, 'connected');
            document.getElementById('notes').value = '';
            updateRecentLog(newEntry);
        }

        // ── UI helpers ────────────────────────────────────────────

        function updateRecentLog(entry) {
            const logDiv = document.getElementById('recentLog');
            logDiv.innerHTML = '';
            const pre = document.createElement('pre');
            pre.textContent = entry;
            logDiv.appendChild(pre);
        }

        function setStatus(message, type = '') {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + type;
        }

        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('collapsed');
        }

        function showLoggerPanel() {
            const folderPath = document.getElementById('folderPath').value;
            document.getElementById('folderPathLogger').value = folderPath;
            document.getElementById('configPanel').classList.add('hidden');
            document.getElementById('loggerPanel').classList.remove('hidden');
            if (!config.username || !config.hostname) {
                document.getElementById('settingsPanel').classList.remove('collapsed');
                setStatus('Please enter username and hostname in Settings', 'error');
            } else {
                setStatus('Connected to Dropbox', 'connected');
            }
        }

        // ── Auth ──────────────────────────────────────────────────

        async function connectDropbox() {
            saveConfig();
            const { codeVerifier, codeChallenge } = await generatePKCE();
            localStorage.setItem('pkce_verifier', codeVerifier);
            const redirectUri = window.location.origin + window.location.pathname;
            const authUrl = 'https://www.dropbox.com/oauth2/authorize?' + new URLSearchParams({
                client_id: DROPBOX_APP_KEY,
                response_type: 'code',
                redirect_uri: redirectUri,
                code_challenge: codeChallenge,
                code_challenge_method: 'S256',
                token_access_type: 'offline'   // gets us a refresh token
            });
            window.location.href = authUrl;
        }

        function disconnect() {
            localStorage.removeItem('dropboxAccessToken');
            localStorage.removeItem('dropboxRefreshToken');
            localStorage.removeItem('pkce_verifier');
            dbx = null;
            document.getElementById('configPanel').classList.remove('hidden');
            document.getElementById('loggerPanel').classList.add('hidden');
            setStatus('Disconnected', '');
        }

        // ── Init ──────────────────────────────────────────────────

        async function init() {
            loadConfig();

            // OAuth callback: code in query string
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            if (code) {
                setStatus('Connecting to Dropbox...', '');
                try {
                    const tokens = await exchangeCodeForTokens(code);
                    localStorage.setItem('dropboxAccessToken', tokens.access_token);
                    if (tokens.refresh_token) {
                        localStorage.setItem('dropboxRefreshToken', tokens.refresh_token);
                    }
                } catch (e) {
                    setStatus('Connection failed. Please try again.', 'error');
                }
                // Clean up URL
                window.history.replaceState({}, '', window.location.pathname);
            }

            // Check for saved token
            const savedToken = localStorage.getItem('dropboxAccessToken');
            if (savedToken) {
                dbx = new Dropbox.Dropbox({ accessToken: savedToken });
                showLoggerPanel();
            }

            document.getElementById('connectBtn').addEventListener('click', connectDropbox);
            document.getElementById('disconnectBtn').addEventListener('click', disconnect);
            document.getElementById('settingsToggle').addEventListener('click', toggleSettings);
            document.getElementById('startBtn').addEventListener('click', () => writeEntry('writing'));
            document.getElementById('doneBtn').addEventListener('click', () => writeEntry('done'));
        }

        init();
    </script>
</body>
</html>
