<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <title>Zettelkasten</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #2a2a2a;
            padding: 1rem;
            text-align: center;
            border-bottom: 2px solid #3a3a3a;
        }
        .header h1 { font-size: 1.5rem; font-weight: 600; }

        .status {
            padding: 0.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: #888;
        }
        .status.connected { color: #4CAF50; }
        .status.error     { color: #f44336; }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            gap: 1rem;
        }

        /* ── Config panel (pre-connect) ── */
        .config {
            background: #2a2a2a;
            padding: 1.5rem;
            border-radius: 8px;
        }
        .config h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #aaa; }

        .config-field { margin-bottom: 1rem; }
        .config-field label {
            display: block;
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 0.5rem;
        }
        .config-field input {
            width: 100%;
            padding: 0.75rem;
            background: #1a1a1a;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            color: #ffffff;
            font-size: 1rem;
        }

        /* ── Settings collapsible (post-connect) ── */
        .settings-collapsible { margin-bottom: 1rem; }
        .settings-collapsible.collapsed { display: none; }

        /* ── Note creation area ── */
        .note-area { display: flex; flex-direction: column; gap: 0.75rem; }

        .title-row {
            display: flex;
            gap: 0.5rem;
            align-items: stretch;
        }
        .title-row input {
            flex: 1;
            padding: 0.85rem 1rem;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            color: #fff;
            font-size: 1.1rem;
        }
        .title-row input:focus { outline: none; border-color: #6c8ebf; }

        /* ── Buttons ── */
        button {
            padding: 0.9rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
        }
        button:active { transform: scale(0.97); }

        .btn-create {
            width: 100%;
            padding: 1.4rem;
            font-size: 1.4rem;
            background: #4CAF50;
            color: white;
        }
        .btn-create:active { background: #45a049; }

        .btn-connect {
            width: 100%;
            background: #0061FF;
            color: white;
            margin-top: 0.5rem;
        }
        .btn-settings-toggle {
            background: transparent;
            border: 1px solid #3a3a3a;
            color: #888;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            text-transform: none;
            letter-spacing: normal;
            align-self: flex-start;
        }
        .btn-settings-toggle:active { background: #2a2a2a; }

        .btn-disconnect {
            width: 100%;
            background: #555;
            color: white;
            margin-top: 0.5rem;
        }

        #noteContent {
            width: 100%;
            padding: 0.85rem 1rem;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            color: #fff;
            font-size: 0.95rem;
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
            resize: vertical;
            line-height: 1.5;
        }
        #noteContent:focus { outline: none; border-color: #6c8ebf; }

        /* ── Recent notes log ── */
        .recent {
            background: #2a2a2a;
            padding: 1rem;
            border-radius: 8px;
            margin-top: auto;
            font-size: 0.85rem;
            color: #888;
            max-height: 220px;
            overflow-y: auto;
        }
        .recent-title { font-weight: 600; margin-bottom: 0.5rem; color: #aaa; }
        .recent-entry {
            padding: 0.4rem 0;
            border-top: 1px solid #3a3a3a;
            font-family: monospace;
            color: #ccc;
        }
        .recent-entry span { color: #888; font-size: 0.8rem; }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="header">
    <h1>📝 Zettelkasten</h1>
</div>
<div class="status" id="status">Not connected</div>

<div class="main">

    <!-- Pre-connect panel -->
    <div class="config" id="configPanel">
        <h2>Connect to Dropbox</h2>
        <div class="config-field">
            <label>Notes Folder Path</label>
            <input type="text" id="folderPath" placeholder="/notes" value="/notes">
        </div>
        <button class="btn-connect" id="connectBtn">Connect to Dropbox</button>
    </div>

    <!-- Post-connect panel -->
    <div id="loggerPanel" class="hidden">

        <button class="btn-settings-toggle" id="settingsToggle">⚙️ Settings</button>

        <div class="config settings-collapsible collapsed" id="settingsPanel">
            <h2>Settings</h2>
            <div class="config-field">
                <label>Notes Folder Path</label>
                <input type="text" id="folderPathLogger" placeholder="/notes">
            </div>
            <button class="btn-disconnect" id="disconnectBtn">Disconnect from Dropbox</button>
        </div>

        <div class="note-area">
            <div class="title-row">
                <input type="text" id="noteTitle" placeholder="Note title (leave blank for untitled)"
                       autocomplete="off" autocorrect="off" spellcheck="true">
            </div>
            <textarea id="noteContent" rows="10" spellcheck="true"></textarea>
            <button class="btn-create" id="createBtn">✚ Create Note</button>
        </div>

        <div class="recent" id="recentNotes">
            <div class="recent-title">Recent notes</div>
            <div style="color:#555; font-style:italic;">None yet this session</div>
        </div>

    </div>
</div>

<script src="https://unpkg.com/dropbox/dist/Dropbox-sdk.min.js"></script>
<script>
    const DROPBOX_APP_KEY = 'luhsj9orw2rvhzy';

    let dbx = null;
    let config = { folderPath: '/notes' };
    let recentNotes = [];

    // ── PKCE helpers ────────────────────────────────────────────

    function generateRandomString(length) {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
        const vals  = crypto.getRandomValues(new Uint8Array(length));
        return Array.from(vals, v => chars[v % chars.length]).join('');
    }

    async function generatePKCE() {
        const codeVerifier  = generateRandomString(128);
        const data          = new TextEncoder().encode(codeVerifier);
        const digest        = await crypto.subtle.digest('SHA-256', data);
        const codeChallenge = btoa(String.fromCharCode(...new Uint8Array(digest)))
            .replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
        return { codeVerifier, codeChallenge };
    }

    async function exchangeCodeForTokens(code) {
        const codeVerifier = localStorage.getItem('pkce_verifier');
        const redirectUri  = window.location.origin + window.location.pathname;
        const response = await fetch('https://api.dropboxapi.com/oauth2/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
                code,
                grant_type:    'authorization_code',
                client_id:     DROPBOX_APP_KEY,
                redirect_uri:  redirectUri,
                code_verifier: codeVerifier
            })
        });
        if (!response.ok) throw new Error('Token exchange failed');
        return response.json();
    }

    async function refreshAccessToken() {
        const refreshToken = localStorage.getItem('dropboxRefreshToken');
        if (!refreshToken) return false;
        try {
            const response = await fetch('https://api.dropboxapi.com/oauth2/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    refresh_token: refreshToken,
                    grant_type:    'refresh_token',
                    client_id:     DROPBOX_APP_KEY
                })
            });
            if (!response.ok) return false;
            const data = await response.json();
            localStorage.setItem('dropboxAccessToken', data.access_token);
            dbx = new Dropbox.Dropbox({ accessToken: data.access_token });
            return true;
        } catch { return false; }
    }

    // ── Config ────────────────────────────────────────────────

    function loadConfig() {
        const saved = localStorage.getItem('zkConfig');
        if (saved) {
            config = JSON.parse(saved);
            document.getElementById('folderPath').value       = config.folderPath;
            document.getElementById('folderPathLogger').value = config.folderPath;
        }
    }

    function saveConfig() {
        const logger = document.getElementById('folderPathLogger');
        config.folderPath = (logger && logger.value) ? logger.value
                          : document.getElementById('folderPath').value;
        localStorage.setItem('zkConfig', JSON.stringify(config));
    }

    // ── Note template ─────────────────────────────────────────

    function templateContent(title) {
        const isUntitled = !title || title === 'untitled';
        let content = `\n\n#untagged\n`;
        if (isUntitled) content += `#untitled\n`;
        return content;
    }

    function resetTemplate(title) {
        const textarea = document.getElementById('noteContent');
        textarea.value = templateContent(title);
        // Position cursor after the blank first line, before the tags
        textarea.setSelectionRange(0, 0);
    }

    // ── Note creation ─────────────────────────────────────────

    function getDatetime() {
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        return `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}`
             + `${pad(now.getHours())}${pad(now.getMinutes())}`;
    }

    async function createNote() {
        if (!dbx) { setStatus('Not connected to Dropbox', 'error'); return; }
        saveConfig();

        const rawTitle  = document.getElementById('noteTitle').value.trim();
        const title     = rawTitle || 'untitled';
        const datetime  = getDatetime();
        const body      = document.getElementById('noteContent').value.trimEnd();
        const content   = `# ${title}\n` + body + `\n[[${datetime}]]\n`;

        const folder    = config.folderPath.replace(/\/$/, '');
        const filePath  = `${folder}/${datetime}.txt`;

        try {
            await doCreate(filePath, content, title, datetime);
        } catch (err) {
            if (err.status === 401) {
                setStatus('Session expired, refreshing…', '');
                if (await refreshAccessToken()) {
                    try { await doCreate(filePath, content, title, datetime); }
                    catch (e) { setStatus(`Error: ${e.message}`, 'error'); }
                } else {
                    localStorage.removeItem('dropboxAccessToken');
                    localStorage.removeItem('dropboxRefreshToken');
                    dbx = null;
                    document.getElementById('configPanel').classList.remove('hidden');
                    document.getElementById('loggerPanel').classList.add('hidden');
                    setStatus('Session expired. Please reconnect.', 'error');
                }
            } else {
                setStatus(`Error: ${err.message}`, 'error');
            }
        }
    }

    async function doCreate(filePath, content, title, datetime) {
        setStatus('Creating note…', '');

        const token = localStorage.getItem('dropboxAccessToken');
        const response = await fetch('https://content.dropboxapi.com/2/files/upload', {
            method: 'POST',
            headers: {
                'Authorization':   `Bearer ${token}`,
                'Dropbox-API-Arg': JSON.stringify({
                    path:        filePath,
                    mode:        { '.tag': 'add' },
                    autorename:  false
                }),
                'Content-Type':    'application/octet-stream'
            },
            body: new TextEncoder().encode(content)
        });

        if (!response.ok) {
            const text = await response.text();
            console.error('Dropbox upload error:', response.status, text);
            let summary = response.statusText;
            try { summary = JSON.parse(text).error_summary || summary; } catch {}
            throw { status: response.status, message: summary };
        }

        setStatus(`✓ Created ${datetime}.txt`, 'connected');
        document.getElementById('noteTitle').value = '';
        resetTemplate('');
        document.getElementById('noteTitle').focus();
        addToRecent(datetime, title);
    }

    // ── Recent notes list ────────────────────────────────────

    function addToRecent(datetime, title) {
        recentNotes.unshift({ datetime, title });
        renderRecent();
    }

    function renderRecent() {
        const div = document.getElementById('recentNotes');
        if (recentNotes.length === 0) {
            div.innerHTML = '<div class="recent-title">Recent notes</div>'
                          + '<div style="color:#555;font-style:italic;">None yet this session</div>';
            return;
        }
        div.innerHTML = '<div class="recent-title">Recent notes</div>'
            + recentNotes.map(n =>
                `<div class="recent-entry">${n.datetime}.txt`
              + `<br><span>${n.title}</span></div>`
            ).join('');
    }

    // ── UI helpers ────────────────────────────────────────────

    function setStatus(msg, type = '') {
        const el = document.getElementById('status');
        el.textContent = msg;
        el.className   = 'status ' + type;
    }

    function toggleSettings() {
        document.getElementById('settingsPanel').classList.toggle('collapsed');
    }

    function showLoggerPanel() {
        document.getElementById('folderPathLogger').value = config.folderPath;
        document.getElementById('configPanel').classList.add('hidden');
        document.getElementById('loggerPanel').classList.remove('hidden');
        resetTemplate('');
        if (!config.folderPath) {
            document.getElementById('settingsPanel').classList.remove('collapsed');
            setStatus('Please set the notes folder path in Settings', 'error');
        } else {
            setStatus('Connected to Dropbox', 'connected');
        }
        setTimeout(() => document.getElementById('noteTitle').focus(), 100);
    }

    // ── Auth ──────────────────────────────────────────────────

    async function connectDropbox() {
        saveConfig();
        const { codeVerifier, codeChallenge } = await generatePKCE();
        localStorage.setItem('pkce_verifier', codeVerifier);
        const redirectUri = window.location.origin + window.location.pathname;
        const authUrl = 'https://www.dropbox.com/oauth2/authorize?' + new URLSearchParams({
            client_id:            DROPBOX_APP_KEY,
            response_type:        'code',
            redirect_uri:         redirectUri,
            code_challenge:       codeChallenge,
            code_challenge_method:'S256',
            token_access_type:    'offline'
        });
        window.location.href = authUrl;
    }

    function disconnect() {
        localStorage.removeItem('dropboxAccessToken');
        localStorage.removeItem('dropboxRefreshToken');
        localStorage.removeItem('pkce_verifier');
        dbx = null;
        document.getElementById('configPanel').classList.remove('hidden');
        document.getElementById('loggerPanel').classList.add('hidden');
        setStatus('Disconnected', '');
    }

    // ── Init ──────────────────────────────────────────────────

    async function init() {
        loadConfig();

        // OAuth callback: code in query string
        const params = new URLSearchParams(window.location.search);
        const code   = params.get('code');
        if (code) {
            setStatus('Connecting to Dropbox…', '');
            try {
                const tokens = await exchangeCodeForTokens(code);
                localStorage.setItem('dropboxAccessToken', tokens.access_token);
                if (tokens.refresh_token) {
                    localStorage.setItem('dropboxRefreshToken', tokens.refresh_token);
                }
            } catch {
                setStatus('Connection failed. Please try again.', 'error');
            }
            window.history.replaceState({}, '', window.location.pathname);
        }

        const savedToken = localStorage.getItem('dropboxAccessToken');
        if (savedToken) {
            dbx = new Dropbox.Dropbox({ accessToken: savedToken });
            showLoggerPanel();
        }

        document.getElementById('connectBtn').addEventListener('click', connectDropbox);
        document.getElementById('disconnectBtn').addEventListener('click', disconnect);
        document.getElementById('settingsToggle').addEventListener('click', toggleSettings);
        document.getElementById('createBtn').addEventListener('click', createNote);

        // Cmd/Ctrl+Enter in textarea creates the note
        document.getElementById('noteContent').addEventListener('keydown', e => {
            if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) createNote();
        });

        // Enter in title field moves focus to textarea — preventDefault stops
        // the Enter being typed into the textarea as a newline
        document.getElementById('noteTitle').addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const textarea = document.getElementById('noteContent');
                textarea.focus();
                textarea.setSelectionRange(0, 0);
            }
        });

        // Toggle #untitled tag as the user types (or clears) the title
        document.getElementById('noteTitle').addEventListener('input', () => {
            const title    = document.getElementById('noteTitle').value.trim();
            const textarea = document.getElementById('noteContent');
            const hasTag   = textarea.value.includes('#untitled\n');
            if (!title && !hasTag) {
                textarea.value = textarea.value.replace('#untagged\n', '#untagged\n#untitled\n');
            } else if (title && hasTag) {
                textarea.value = textarea.value.replace('#untitled\n', '');
            }
        });
    }

    init();
</script>
</body>
</html>
